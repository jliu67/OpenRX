name: Foundation and Phase 1 checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: python3 scripts/verify_vendor.py
      - name: Phase 1 tooling regression tests
        run: |
          mkdir -p build/validation
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee build/validation/phase1-tests.log
      - name: Reproduce static workload profile
        run: |
          python3 scripts/workload_profile.py --output build/validation/workload-profile.json
          diff -u benchmarks/profiles/pinned-v2.0.1.json build/validation/workload-profile.json
      - name: Build pinned source and steady adapter
        run: bash scripts/build_steady.sh
      - name: Upstream correctness tests
        run: bash scripts/test.sh
      - name: Both algorithm smoke runs
        run: python3 scripts/benchmark.py --mode verify --versions v1 v2 --nonces 2 --repeats 1
      - name: Full-dataset reference controls (not a performance baseline)
        # Deferred, not passed: full-dataset workloads require a reviewed owner-local request.
        # See docs/LOCAL_EXECUTION.md and https://github.com/jliu67/OpenRX/issues/27.
        if: ${{ false }}
        run: python3 scripts/benchmark.py --mode mine --versions v1 v2 --threads 1 --init-threads 2 --nonces 1000 --repeats 1 --timeout 300
      - name: Same-process native controls (not a performance baseline)
        # native_steady.py initializes the full dataset, including its upstream --mine differential.
        # Deferred to the local runner; a green hosted check does not certify these controls.
        # See docs/LOCAL_EXECUTION.md and https://github.com/jliu67/OpenRX/issues/27.
        if: ${{ false }}
        run: |
          set -o pipefail
          python3 tests/native_steady.py 2>&1 | tee build/validation/steady-native-tests.log
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correctness-logs
          path: |
            build/validation/
            benchmarks/results/
