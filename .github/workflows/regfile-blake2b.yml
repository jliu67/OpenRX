name: Native register-file BLAKE2b and hardware program seeds
on:
  pull_request:
    paths:
      - 'rtl/hash/**'
      - 'rtl/execute/**'
      - 'rtl/aes/**'
      - 'rtl/engine/**'
      - 'rtl/iteration/**'
      - 'vendor/randomx/**'
      - 'vendor/randomx.sha256.json'
      - 'vendor/randomx.lock.json'
      - 'scripts/test_regfile_blake2b.py'
      - 'scripts/regfile_hash_fixture.py'
      - 'scripts/test_divsqrt_execute.py'
      - 'scripts/test_iteration_engine.py'
      - 'scripts/program_sequence_fixture.py'
      - 'scripts/hardfloat_compile_view.py'
      - 'docs/validation/program-sequence-20261013/server-current/inputs.json'
      - 'rtl/hash/tests/accepted-full-registers.*'
      - 'scripts/divsqrt_fixture.py'
      - 'scripts/test_program_sequence.py'
      - '.github/workflows/regfile-blake2b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-hash-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - name: Install official HDL packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog yosys
      - name: Check native digests, connected hardware seeds and new mapped stages
        run: |
          python3 scripts/test_regfile_blake2b.py \
            --output "$RUNNER_TEMP/regfile-blake2b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --synthesize
      - name: Retain complete licensed outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regfile-blake2b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/regfile-blake2b-${{ github.run_id }}-${{ github.run_attempt }}/
