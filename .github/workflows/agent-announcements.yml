name: OpenRX hub announcements
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
# One authorized command creates a single bot-authored, subscriber-notifiable post.
# Only a hub comment explicitly beginning /openrx announce is eligible.
concurrency:
  group: openrx-hub-announcements
  cancel-in-progress: false
jobs:
  announce:
    if: >-
      github.event.issue.number == 5 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/openrx announce')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test announcement authorization and deduplication
        run: python3 -m unittest discover -s tests -p test_agent_announce.py -v
      - name: Publish one GitHub Actions bot announcement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent_announce.py
