name: Agent message router
on:
  issues:
    types: [opened, edited, reopened, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number to check explicitly; all threads are always reconciled
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-router.yml
      - scripts/agent_router.py
      - tests/test_agent_router.py
permissions:
  contents: read
  issues: write
# A pending run may be replaced. Each run replays ALL threads (open and closed), not just its event.
concurrency:
  group: openrx-agent-router
  cancel-in-progress: false
jobs:
  route:
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name != 'issue_comment' || github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified 2026-10-08
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test coordination logic before writes
        run: python3 -m unittest discover -s tests -p test_agent_router.py -v
      - name: Reconcile GitHub message threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent_router.py
