name: Prepared reciprocal model guards
on:
  pull_request:
    paths:
      - 'scripts/reciprocal_cycle_model.py'
      - 'tests/test_reciprocal_cycle_model.py'
      - '.github/workflows/prepared-reciprocals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check accounting rejection and calibration equations
        run: python3 -B -m unittest discover -s tests -p test_reciprocal_cycle_model.py -v
      # Native RTL comparisons and actual synthesis execute only in the
      # authorized server's admitted serial payload, with retained receipts.
