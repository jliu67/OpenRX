name: RISC-V functional preflight
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scalar-correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged pinned source
        run: python3 scripts/verify_vendor.py
      - name: Install compiler and functional emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-14-riscv64-linux-gnu g++-14-riscv64-linux-gnu qemu-user
      - name: Record environment and build native probe
        run: |
          mkdir -p build/riscv-validation
          set -o pipefail
          {
            uname -a
            cmake --version
            g++ --version
            riscv64-linux-gnu-g++-14 --version
            riscv64-linux-gnu-as --version
            qemu-riscv64 --version
            dpkg-query -W cmake gcc-14-riscv64-linux-gnu g++-14-riscv64-linux-gnu qemu-user libc6-riscv64-cross
            git rev-parse HEAD
          } > build/riscv-validation/environment.txt
          cmake -S simulator/probe -B build/probe-native -DCMAKE_BUILD_TYPE=Release -DARCH=default -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee build/riscv-validation/native-configure.log
          cmake --build build/probe-native --target openrx-riscv-probe --parallel 2 2>&1 | tee build/riscv-validation/native-build.log
      - name: Native exact semantic and v1/v2 controls
        run: python3 tests/native_riscv_probe.py --binary build/probe-native/openrx-riscv-probe --output-dir build/riscv-validation/native
      - name: Native Linux signal, protection and code-overwrite controls
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror simulator/runtime-probe/main.c -o build/probe-native/openrx-runtime-probe
          python3 tests/native_runtime_probe.py --binary build/probe-native/openrx-runtime-probe --output-dir build/riscv-validation/runtime-native
      - name: Build scalar RISC-V probe
        run: |
          set -o pipefail
          cmake -S simulator/probe -B build/probe-riscv -DCMAKE_BUILD_TYPE=Release -DARCH=default -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_TOOLCHAIN_FILE="$PWD/simulator/toolchains/riscv64-linux-gnu.cmake" 2>&1 | tee build/riscv-validation/riscv-configure.log
          cmake --build build/probe-riscv --target openrx-riscv-probe --parallel 2 2>&1 | tee build/riscv-validation/riscv-build.log
          riscv64-linux-gnu-readelf -h -A build/probe-riscv/openrx-riscv-probe > build/riscv-validation/riscv-elf.txt
          riscv64-linux-gnu-objdump -d build/probe-riscv/openrx-riscv-probe > build/riscv-validation/riscv-disassembly.txt
          sha256sum build/probe-riscv/openrx-riscv-probe > build/riscv-validation/riscv-binary.sha256
      - name: QEMU RV64GC exact semantic and v1/v2 controls
        run: python3 tests/native_riscv_probe.py --binary build/probe-riscv/openrx-riscv-probe --qemu qemu-riscv64 --sysroot /usr/riscv64-linux-gnu --output-dir build/riscv-validation/qemu
      - name: QEMU Linux signal, protection and explicit cache-flush controls
        run: |
          riscv64-linux-gnu-gcc-14 -std=c11 -O2 -Wall -Wextra -Werror -march=rv64gc -mabi=lp64d simulator/runtime-probe/main.c -o build/probe-riscv/openrx-runtime-probe
          python3 tests/native_runtime_probe.py --binary build/probe-riscv/openrx-runtime-probe --qemu qemu-riscv64 --sysroot /usr/riscv64-linux-gnu --output-dir build/riscv-validation/runtime-qemu
      - name: Preserve logs, binary and configuration even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv-functional-preflight
          retention-days: 90
          path: |
            build/riscv-validation/
            build/probe-riscv/openrx-riscv-probe
            build/probe-riscv/openrx-runtime-probe
            build/probe-riscv/CMakeCache.txt
            build/probe-riscv/compile_commands.json
            build/probe-native/CMakeCache.txt
            build/probe-native/compile_commands.json
